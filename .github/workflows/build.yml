name: build

# Nothing here reaches a registry, a mirror or a live site, so every job is a gate rather
# than a detector and pull requests run all of them
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Every checker below is plain bash that falsifies itself on every run, so no
      # toolchain beyond the runner's bash is pinned here because none is used
      - name: check-skill.sh (frontmatter, reachable references, resolving links)
        run: ./check-skill.sh -n companion

      - name: check-pins.sh (no unpinned tool lookups in the workflows)
        run: ./check-pins.sh

      # No flag: the checker reads origin and works out whether it is the template — where
      # the placeholders must be intact — or a copy, where any survivor is a failure. So
      # this step is the same line in a fork, and there is nothing to remember to change
      - name: check-template.sh (placeholders intact here, gone in a fork)
        run: ./check-template.sh
